name: Evergreen Env Validate Status

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_run:
    workflows:
      - Validate In Evergreen Env
      - Evergreen Environment Validate
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to comment on
        required: true
      agentgateway_ref:
        description: Agentgateway SHA to validate (defaults to current SHA if omitted)
        required: false

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  validate-and-comment:
    name: Wait for remote validation and comment
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - name: Mint Orion installation token
        id: orion_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ORION_APP_ID }}
          private-key: ${{ secrets.ORION_APP_PRIVATE_KEY }}
          owner: money-evergreen
          repositories: evergreen-mcp-gateway,agentgateway

      - name: Poll remote validation run and update PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.orion_token.outputs.token }}
          script: |
            const marker = '<!-- evergreen-env-validation -->';
            const sourceOwner = context.repo.owner;
            const sourceRepo = context.repo.repo;
            const targetOwner = 'money-evergreen';
            const targetRepo = 'evergreen-mcp-gateway';
            const targetWorkflowName = 'Validate Agentgateway Ref In Evergreen Env';
            const timeoutMs = 20 * 60 * 1000;
            const pollIntervalMs = 25000;
            const startedAt = Date.now();

            function emojiForConclusion(conclusion) {
              switch (conclusion) {
                case 'success':
                  return '✅';
                case 'failure':
                  return '❌';
                case 'cancelled':
                  return '🚫';
                case 'timed_out':
                  return '⏱️';
                case 'action_required':
                  return '⚠️';
                case 'skipped':
                  return '⏭️';
                default:
                  return '❓';
              }
            }

            function shortSha(sha) {
              return (sha || '').slice(0, 7);
            }

            async function getPrAndSha() {
              if (context.eventName === 'pull_request') {
                return {
                  prNumber: context.payload.pull_request.number,
                  sha: context.payload.pull_request.head.sha,
                };
              }

              if (context.eventName === 'workflow_run') {
                const linkedPr = context.payload.workflow_run.pull_requests?.[0];
                if (!linkedPr?.number) {
                  core.setFailed('No pull request linked to workflow_run event.');
                  return null;
                }
                return {
                  prNumber: linkedPr.number,
                  sha: context.payload.workflow_run.head_sha,
                };
              }

              const prInput = context.payload.inputs?.pr_number;
              if (!prInput) {
                core.setFailed('workflow_dispatch requires input: pr_number');
                return null;
              }
              return {
                prNumber: Number(prInput),
                sha: context.payload.inputs?.agentgateway_ref || process.env.GITHUB_SHA,
              };
            }

            const target = await getPrAndSha();
            if (!target) {
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: sourceOwner,
              repo: sourceRepo,
              pull_number: target.prNumber,
            });

            if (pr.draft) {
              core.notice(`PR #${target.prNumber} is draft. Skipping remote validation status check.`);
              return;
            }

            const expectedSha = target.sha || pr.head.sha;
            const expectedShaLower = expectedSha.toLowerCase();
            const expectedShortShaLower = shortSha(expectedSha).toLowerCase();

            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner: targetOwner,
              repo: targetRepo,
              per_page: 100,
            });

            const targetWorkflow = workflows.workflows.find(
              (workflow) => workflow.name === targetWorkflowName
            );

            if (!targetWorkflow) {
              core.setFailed(
                `Could not find workflow "${targetWorkflowName}" in ${targetOwner}/${targetRepo}.`
              );
              return;
            }

            let conclusion = null;
            let runUrl = null;
            let remoteRunId = null;

            while (Date.now() - startedAt < timeoutMs) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: targetOwner,
                repo: targetRepo,
                workflow_id: targetWorkflow.id,
                event: 'repository_dispatch',
                per_page: 100,
              });

              const matchingRun = runs.workflow_runs.find((run) => {
                const searchText = `${run.display_title || ''} ${run.name || ''}`.toLowerCase();
                return (
                  run.head_sha === expectedSha ||
                  searchText.includes(expectedShaLower) ||
                  (expectedShortShaLower && searchText.includes(expectedShortShaLower))
                );
              });

              if (matchingRun) {
                runUrl = matchingRun.html_url;
                remoteRunId = matchingRun.id;
                if (matchingRun.status === 'completed') {
                  conclusion = matchingRun.conclusion || 'unknown';
                  break;
                }
              }

              await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
            }

            if (!conclusion) {
              conclusion = 'timed_out';
            }

            const statusEmoji = emojiForConclusion(conclusion);
            const runLink = runUrl ? `[View run](${runUrl})` : 'Run not found';
            const commentBody = `${marker}
            ## Evergreen Environment Validation
            - SHA validated: \`${expectedSha}\`
            - Status: ${statusEmoji} **${conclusion}**
            - Remote run: ${runLink}
            - Updated: ${new Date().toISOString()}`.replace(/^            /gm, '');

            const { data: comments } = await github.rest.issues.listComments({
              owner: sourceOwner,
              repo: sourceRepo,
              issue_number: target.prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: sourceOwner,
                repo: sourceRepo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: sourceOwner,
                repo: sourceRepo,
                issue_number: target.prNumber,
                body: commentBody,
              });
            }

            if (conclusion !== 'success') {
              const suffix = remoteRunId ? ` (run id: ${remoteRunId})` : '';
              core.setFailed(`Remote Evergreen validation concluded with "${conclusion}"${suffix}.`);
            }
