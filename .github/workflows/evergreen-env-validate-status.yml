name: Evergreen Env Validate Status

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_run:
    workflows:
      - Validate In Evergreen Env
      - Evergreen Environment Validate
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to comment on
        required: true
      agentgateway_ref:
        description: Agentgateway SHA to validate (defaults to current SHA if omitted)
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  validate-and-comment:
    name: Wait for remote validation and comment
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - name: Mint Orion installation token
        id: orion_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.ORION_APP_ID }}
          private-key: ${{ secrets.ORION_APP_PRIVATE_KEY }}
          owner: money-evergreen
          repositories: evergreen-mcp-gateway,agentgateway

      - name: Poll remote validation run and update PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.orion_token.outputs.token }}
          script: |
            const marker = '<!-- evergreen-env-validation -->';
            const sourceOwner = context.repo.owner;
            const sourceRepo = context.repo.repo;
            const targetOwner = 'money-evergreen';
            const targetRepo = 'evergreen-mcp-gateway';
            const targetWorkflowName = 'Validate Agentgateway Ref In Evergreen Env';
            const timeoutMs = 30 * 60 * 1000;
            const pollIntervalMs = 25000;
            const startedAt = Date.now();

            function emojiForConclusion(conclusion) {
              switch (conclusion) {
                case 'success':
                  return '✅';
                case 'failure':
                  return '❌';
                case 'cancelled':
                  return '🚫';
                case 'timed_out':
                  return '⏱️';
                case 'action_required':
                  return '⚠️';
                case 'skipped':
                  return '⏭️';
                case 'error':
                  return '⚠️';
                default:
                  return '❓';
              }
            }

            function shortSha(sha) {
              return (sha || '').slice(0, 7);
            }

            function elapsedStr() {
              const secs = Math.round((Date.now() - startedAt) / 1000);
              const m = Math.floor(secs / 60);
              const s = secs % 60;
              return `${m}m${s}s`;
            }

            async function fetchRemoteRunDiagnostics(runId) {
              if (!runId) return null;
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: targetOwner,
                  repo: targetRepo,
                  run_id: runId,
                });
                const diag = {
                  status: run.status,
                  conclusion: run.conclusion,
                  currentJob: null,
                  currentStep: null,
                };
                try {
                  const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                    owner: targetOwner,
                    repo: targetRepo,
                    run_id: runId,
                    per_page: 50,
                  });
                  const activeJob = jobs.jobs.find(
                    (j) => j.status === 'in_progress' || j.status === 'queued'
                  ) || jobs.jobs[jobs.jobs.length - 1];
                  if (activeJob) {
                    diag.currentJob = activeJob.name;
                    const activeStep = activeJob.steps?.find(
                      (s) => s.status === 'in_progress' || s.status === 'queued'
                    );
                    if (activeStep) {
                      diag.currentStep = activeStep.name;
                    }
                  }
                } catch (_) {
                  // jobs API may fail; diagnostics are best-effort
                }
                return diag;
              } catch (_) {
                return null;
              }
            }

            async function getPrAndSha() {
              if (context.eventName === 'pull_request') {
                return {
                  prNumber: context.payload.pull_request.number,
                  sha: context.payload.pull_request.head.sha,
                };
              }

              if (context.eventName === 'workflow_run') {
                const linkedPr = context.payload.workflow_run.pull_requests?.[0];
                if (!linkedPr?.number) {
                  core.setFailed('No pull request linked to workflow_run event.');
                  return null;
                }
                return {
                  prNumber: linkedPr.number,
                  sha: context.payload.workflow_run.head_sha,
                };
              }

              const prInput = context.payload.inputs?.pr_number;
              if (!prInput) {
                core.setFailed('workflow_dispatch requires input: pr_number');
                return null;
              }
              return {
                prNumber: Number(prInput),
                sha: context.payload.inputs?.agentgateway_ref || process.env.GITHUB_SHA,
              };
            }

            const target = await getPrAndSha();
            if (!target) {
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: sourceOwner,
              repo: sourceRepo,
              pull_number: target.prNumber,
            });

            if (pr.draft) {
              core.notice(`PR #${target.prNumber} is draft. Skipping remote validation status check.`);
              return;
            }

            const expectedSha = target.sha || pr.head.sha;
            const expectedShaLower = expectedSha.toLowerCase();
            const expectedShortShaLower = shortSha(expectedSha).toLowerCase();
            const expectedSourceRepo = `${sourceOwner}/${sourceRepo}`;
            const expectedSourcePr = String(target.prNumber);
            const expectedRequestId = `${expectedSourceRepo}:${expectedSourcePr}:${expectedSha}`;
            const expectedRequestIdLower = expectedRequestId.toLowerCase();
            const expectedPrTokenLower = `${expectedSourceRepo}#${expectedSourcePr}`.toLowerCase();

            let conclusion = null;
            let runUrl = null;
            let remoteRunId = null;
            let runError = null;
            let lastRemoteStatus = null;

            try {
              const { data: workflows } = await github.rest.actions.listRepoWorkflows({
                owner: targetOwner,
                repo: targetRepo,
                per_page: 100,
              });

              const targetWorkflow = workflows.workflows.find(
                (workflow) => workflow.name === targetWorkflowName
              );

              if (!targetWorkflow) {
                throw new Error(
                  `Could not find workflow "${targetWorkflowName}" in ${targetOwner}/${targetRepo}.`
                );
              }

              while (Date.now() - startedAt < timeoutMs) {
                const { data: runs } = await github.rest.actions.listWorkflowRuns({
                  owner: targetOwner,
                  repo: targetRepo,
                  workflow_id: targetWorkflow.id,
                  event: 'repository_dispatch',
                  per_page: 100,
                });

                const matchingRun = runs.workflow_runs.find((run) => {
                  const searchText = `${run.display_title || ''} ${run.name || ''}`.toLowerCase();
                  return (
                    searchText.includes(expectedRequestIdLower) ||
                    searchText.includes(expectedPrTokenLower) ||
                    searchText.includes(expectedShaLower) ||
                    (expectedShortShaLower && searchText.includes(expectedShortShaLower))
                  );
                });

                if (matchingRun) {
                  runUrl = matchingRun.html_url;
                  remoteRunId = matchingRun.id;
                  lastRemoteStatus = matchingRun.status;
                  if (matchingRun.status === 'completed') {
                    conclusion = matchingRun.conclusion || 'unknown';
                    break;
                  }
                }

                await new Promise((resolve) => setTimeout(resolve, pollIntervalMs));
              }
            } catch (error) {
              const statusText = error?.status ? `${error.status}` : 'unknown';
              const messageText = error?.message ? String(error.message) : String(error);
              runError = `${statusText}: ${messageText}`;
              conclusion = 'error';
            }

            if (!conclusion) {
              conclusion = 'timed_out';
            }

            // On non-success, fetch diagnostics from the remote run
            let diagLines = '';
            if (conclusion !== 'success' && remoteRunId) {
              const diag = await fetchRemoteRunDiagnostics(remoteRunId);
              if (diag) {
                const parts = [];
                if (diag.status) parts.push(`Remote run status: \`${diag.status}\``);
                if (diag.conclusion) parts.push(`Remote run conclusion: \`${diag.conclusion}\``);
                if (diag.currentJob) parts.push(`Current/last job: \`${diag.currentJob}\``);
                if (diag.currentStep) parts.push(`Current/last step: \`${diag.currentStep}\``);
                if (parts.length > 0) {
                  diagLines = parts.map(p => `- ${p}`).join('\n') + '\n';
                }
              }
            }

            const statusEmoji = emojiForConclusion(conclusion);
            const runLink = runUrl ? `[View run](${runUrl})` : 'Run not found';
            const runIdLine = remoteRunId ? `- Remote run ID: \`${remoteRunId}\`\n` : '';
            const elapsed = `- Poll duration: ${elapsedStr()}\n`;
            const noteLine = runError ? `- Error: \`${runError}\`\n` : '';
            const failReason = conclusion === 'timed_out'
              ? `- Failure reason: Poll timed out after 30m waiting for remote run to complete\n`
              : conclusion === 'error'
                ? `- Failure reason: API error during polling\n`
                : conclusion !== 'success' && conclusion !== 'unknown'
                  ? `- Failure reason: Remote run concluded with \`${conclusion}\`\n`
                  : '';

            const commentBody = `${marker}
            ## Evergreen Environment Validation
            - SHA validated: \`${expectedSha}\`
            - Correlation key: \`${expectedRequestId}\`
            - Status: ${statusEmoji} **${conclusion}**
            - Remote run: ${runLink}
            ${runIdLine}${elapsed}${diagLines}${noteLine}${failReason}
            - Updated: ${new Date().toISOString()}`.replace(/^            /gm, '');

            const { data: comments } = await github.rest.issues.listComments({
              owner: sourceOwner,
              repo: sourceRepo,
              issue_number: target.prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: sourceOwner,
                repo: sourceRepo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: sourceOwner,
                repo: sourceRepo,
                issue_number: target.prNumber,
                body: commentBody,
              });
            }

            if (runError) {
              core.setFailed(`Remote validation check failed before conclusion: ${runError}`);
            } else if (conclusion !== 'success') {
              const suffix = remoteRunId ? ` (run id: ${remoteRunId})` : '';
              core.setFailed(`Remote Evergreen validation concluded with "${conclusion}"${suffix}.`);
            }
